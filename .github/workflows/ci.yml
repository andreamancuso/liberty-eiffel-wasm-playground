name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Record starting resources
        run: |
          date --iso-8601=seconds
          df -h /
          free -h
      - name: Release integrity regressions
        run: python3 release/test_site.py
      - name: Build and verify all stages
        shell: pwsh
        run: ./build-stage3.ps1
      - name: Package tested site
        env:
          REVISION: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 release/site.py package --source artifacts/stage3 --site artifacts/pages
          --revision "$REVISION" --run-id "$GITHUB_RUN_ID" --run-url "$RUN_URL"
      - name: Verify the packaged site under its Pages path
        run: |
          docker run --rm --network none --mount "type=bind,source=$PWD/artifacts/pages,target=/artifacts" liberty-emscripten:stage3-browser
          # The verifier writes diagnostics alongside the site; keep those separate.
          mkdir -p artifacts/pages-verification
          mv artifacts/pages/stage3-result.json artifacts/pages/stage3-browser.png artifacts/pages-verification/
          python3 release/site.py verify --site artifacts/pages --revision "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Upload tested site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playground-site-${{ github.sha }}
          path: artifacts/pages/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ github.run_id }}
          path: |
            artifacts/**/*-result.json
            artifacts/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Record final resources and release instructions
        if: always()
        run: |
          date --iso-8601=seconds
          df -h /
          docker system df
          echo "Build revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Manual Pages release: select CI run **$GITHUB_RUN_ID** after this main build succeeds. Artifacts expire after seven days." >> "$GITHUB_STEP_SUMMARY"
