name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cold_build:
        description: Bypass layer reuse and seed the build caches
        type: boolean
        default: false

      test_workers:
        description: Independent browser groups to run concurrently
        type: choice
        options: ['2', '1']
        default: '2'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up Docker with the containerd image store
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: v29.7.2
          daemon-config: |
            { "features": { "containerd-snapshotter": true } }
      - name: Set up Buildx on the Docker driver
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker
      - name: Expose the GitHub cache runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Record starting resources
        run: |
          date --iso-8601=seconds
          df -h /
          free -h
      - name: Release integrity regressions
        run: python3 release/test_site.py
      - name: Build and verify playground
        shell: pwsh
        env:
          BUILD_CACHE_WRITE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          COLD_BUILD: ${{ inputs.cold_build || false }}
          TEST_WORKERS: ${{ inputs.test_workers || '2' }}
        run: ./build.ps1 -CiCache -ColdBuild:($env:COLD_BUILD -eq 'true') -TestWorkers ([int]$env:TEST_WORKERS)
      - name: Seal the browser-verified candidate
        env:
          REVISION: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 release/site.py seal --site artifacts/site --report artifacts/browser-reports/browser-result.json
          --revision "$REVISION" --run-id "$GITHUB_RUN_ID" --run-url "$RUN_URL"
      - name: Upload tested site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playground-site-${{ github.sha }}
          path: artifacts/site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ github.run_id }}
          path: |
            artifacts/**/*-result.json
            artifacts/**/*.png
            artifacts/build-logs/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record final resources and release instructions
        if: always()
        run: |
          date --iso-8601=seconds
          df -h /
          docker system df
          python3 build/summarize-builds.py artifacts/build-logs >> "$GITHUB_STEP_SUMMARY"
          if test -f artifacts/browser-reports/browser-result.json; then
            python3 tests/browser/summarize-report.py artifacts/browser-reports/browser-result.json >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Build revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Manual Pages release: select CI run **$GITHUB_RUN_ID** after this main build succeeds. Artifacts expire after seven days." >> "$GITHUB_STEP_SUMMARY"
