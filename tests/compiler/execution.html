<!doctype html><html lang="en"><meta charset="utf-8"><title>Browser-generated C verification</title>
<link rel="icon" href="data:,"><pre id="output">Running…</pre>
<script type="module">
window.validation = { status: 'running', results: [] };
try {
    for (const name of ['hello', 'multi']) {
        const expected = await (await fetch(`./${name}.expected.json`)).json();
        const { default: factory } = await import(`./${name}.mjs`);
        const stdout = [], stderr = [];
        const module = await factory({ print: value => stdout.push(value), printErr: value => stderr.push(value) });
        window.validation.results.push({ name, expected, exitCode: module.callMain([]), stdout, stderr });
    }
    window.validation.status = 'complete';
} catch (error) { window.validation.status = 'error'; window.validation.error = String(error.stack || error); }
document.getElementById('output').textContent = JSON.stringify(window.validation, null, 2);
</script></html>
