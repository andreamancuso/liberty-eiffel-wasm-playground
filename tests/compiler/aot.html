<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Ahead-of-time compiler test harness</title>
<link rel="icon" href="data:,">
<h1>Ahead-of-time compiler test harness</h1>
<p>Eiffel was compiled ahead of time. These programs execute as WebAssembly in this browser.</p>
<pre id="output">Running...</pre>
<script type="module">
import hello from './hello.mjs';
import contractFailure from './contract_failure.mjs';

const results = [];
window.aotTests = { status: 'running', results };
async function run(name, factory) {
    const stdout = [];
    const stderr = [];
    const module = await factory({
        print: text => stdout.push(text),
        printErr: text => stderr.push(text),
    });
    const exitCode = module.callMain([]);
    results.push({ name, exitCode, stdout, stderr });
}
try {
    await run('hello', hello);
    await run('contract_failure', contractFailure);
    window.aotTests.status = 'complete';
} catch (error) {
    window.aotTests.status = 'error';
    window.aotTests.error = String(error.stack || error);
}
document.getElementById('output').textContent = JSON.stringify(window.aotTests, null, 2);
</script>
</html>
