<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liberty Eiffel playground</title><link rel="icon" href="data:,">
<style>body{font:16px system-ui;max-width:1000px;margin:2rem auto;padding:0 1rem;background:#f7f8fa;color:#20242a}textarea,pre{box-sizing:border-box;width:100%;font:14px ui-monospace,monospace;padding:1rem;background:white;border:1px solid #bbc3cc;border-radius:4px}textarea{height:230px}#stdin{height:85px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:340px;overflow:auto}button,input{font:inherit;padding:.4rem;margin:.3rem 0}label{display:block}#status{min-height:1.5em}footer{margin-top:2rem;font-size:.875rem}footer a{color:inherit}</style>
<h1>Liberty Eiffel playground</h1><p>Write and run Eiffel.</p>
<label>Filename <input id="filename" value="hello.e" spellcheck="false"></label>
<label for="source">Eiffel source</label><textarea id="source" spellcheck="false">class HELLO
create {}
   make
feature {}
   make
      do
         io.put_string("Hello, world!%N")
      end
end
</textarea>
<label for="stdin">Input (optional)</label><textarea id="stdin" spellcheck="false"></textarea>
<button id="run">Run</button> <button id="stop" disabled>Stop</button><p id="status" role="status">Ready.</p>
<h2>Output</h2><pre id="stdout"></pre>
<section id="errors" hidden><h2>Errors</h2><pre id="diagnostics"></pre></section>
<footer><a href="https://beyond-tabs.com">Beyond Tabs</a> · <a href="https://github.com/andreamancuso/liberty-eiffel-wasm-playground">Source</a></footer>
<script type="module">
import { buildAndRun, getActiveWorkerCount } from './client.mjs';
window.stage3 = { buildAndRun, getActiveWorkerCount };
const el = id => document.getElementById(id);
let controller;
el('stop').onclick = () => controller?.abort();
el('run').onclick = async () => {
    controller = new AbortController(); window.stage3.lastResult = null;
    for (const id of ['stdout','diagnostics']) el(id).textContent = '';
    el('errors').hidden = true;
    el('run').disabled = true; el('stop').disabled = false;
    const filename = el('filename').value;
    const result = await buildAndRun({ rootClass: filename, files: { [filename]: el('source').value }, stdin: el('stdin').value }, {
        signal: controller.signal, onPhase: phase => { el('status').textContent = phase === 'execute' ? 'Running…' : phase.startsWith('loading_') ? 'Preparing…' : 'Compiling…'; },
        onOutput: (text, fd) => {
            if (fd === 2) { el('errors').hidden = false; el('diagnostics').textContent += text; }
            else el('stdout').textContent += text;
        },
    });
    window.stage3.lastResult = result;
    el('stdout').textContent = result.stdout;
    const messages = {
        success:'Finished', cancelled:'Stopped', timed_out:'Time limit reached',
        output_limit_exceeded:'Output limit reached', compiler_error:'Check your code',
        invalid_input:'Check your program', unsupported_feature:'Unsupported feature',
        program_error:'Your program stopped with an error', runtime_error:'Your program stopped unexpectedly',
        initialization_error:'Could not prepare the playground. Please try again.',
    };
    const message = messages[result.status] ?? 'Your program could not be compiled.';
    const details = result.status === 'compiler_error' || result.status === 'invalid_input' ? result.diagnostics
        : result.status === 'unsupported_feature' ? 'rescue/retry is not supported yet.' : '';
    el('diagnostics').textContent = [result.stderr, details].filter(Boolean).join('\n');
    if (!el('diagnostics').textContent && !['success','cancelled'].includes(result.status)) el('diagnostics').textContent = message;
    el('errors').hidden = !el('diagnostics').textContent;
    el('status').textContent = `${message} · ${(result.elapsedMs / 1000).toFixed(2)} s`;
    el('run').disabled = false; el('stop').disabled = true;
};
</script></html>
